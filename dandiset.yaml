description: "Raw widefield fluorescence images of Aβ42 immunolabeling and DAPI in
  brain sections from hemizygous 5XFAD mice, supporting Wright AL, Weible AP, Estes
  OB, Wehr M (2025) \"Ketamine does not rescue plaque load or gap detection in the
  5XFAD mouse model of Alzheimer's disease,\" Frontiers in Aging Neuroscience 17:1505908
  (doi:10.3389/fnagi.2025.1505908; PMCID PMC11830726). The histology validates the
  study's primary behavioral result (acoustic startle gap detection), which is shared
  in a separate Dandiset.\n\nMice received sub-anesthetic ketamine (10 mg/kg i.p.)
  or saline, either as a single injection on P119 (Acute protocol: 12 mice, 6 ketamine
  / 6 saline) or daily from P45 to P156 (Chronic protocol: 14 mice, 7 ketamine / 7
  saline); 26 mice in total (14 male, 12 female). Mice were perfused within 24 h of
  their final behavioral session (P134 acute, P156 chronic). Brains were cut in 30
  µm coronal sections and labeled with rabbit anti-Aβ42 (Invitrogen 700254; Alexa
  Fluor 488 secondary) and DAPI. Plaques were quantified in primary auditory cortex
  (layers 5a–6b) and the caudal pontine reticular nucleus (PRNc).\n\nImages (3,237)
  were acquired on a Zeiss Axio Imager A2 with an AxioCam MRm3 camera in ZEN 3.1,
  one channel per image, and are organized as BIDS-Microscopy: single-channel OME-TIFF
  holding the original 12-bit data. Each image sequence begins with low-magnification
  (12.5X) coronal overviews used to locate 100X and 200X fields; 200X fields include
  Aβ42 images at several focal depths plus DAPI images. Because objectives were changed
  by hand, magnification and pixel size were inferred from image content and checked
  by visual review; each image's sidecar records how. Protocol, treatment, sex and
  age are given in participants.tsv; acquisition times and original file names in
  each subject's scans.tsv. See the README for details, including a note on mouse
  1531, whose metadata were re-linked by acquisition timestamp."
